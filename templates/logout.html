<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ titulo }}</title>
    <!-- Integración de Tailwind CSS vía CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Iconos de Phosphor Icons -->
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
</head>
<body class="bg-slate-100 h-screen flex items-center justify-center font-sans antialiased m-0">

    <div class="max-w-md w-full p-10 bg-white rounded-xl shadow-lg text-center border-t-4 border-blue-700">
        
        <div class="w-20 h-20 bg-blue-50 text-blue-700 rounded-full flex items-center justify-center text-4xl mx-auto mb-6">
            <i class="ph ph-shield-check"></i>
        </div>
        
        <h1 class="text-2xl font-bold text-gray-800 mb-3">¡Sesión finalizada con éxito!</h1>
        
        <p class="text-gray-500 text-base mb-8 leading-relaxed">
            Su sesión ha sido cerrada de forma segura. Gracias por utilizar nuestro <strong>Sistema de Planillas</strong> para la gestión de recursos humanos de su empresa.
        </p>
        
        <a href="/" class="block w-full bg-blue-700 text-white py-3 px-6 rounded-md font-semibold transition-all duration-300 hover:bg-blue-800 hover:-translate-y-0.5 hover:shadow-md mb-6">
            <i class="ph ph-sign-in mr-2 align-middle text-lg"></i> Iniciar sesión nuevamente
        </a>
        
        <div class="border-t border-gray-200 pt-6 mt-3">
            <p class="text-sm text-gray-400 mb-4">¿Te gusta nuestra aplicación? ¡Ayúdanos a crecer compartiéndola!</p>
            <div class="flex justify-center space-x-3">
                <a href="#" class="flex items-center justify-center w-10 h-10 rounded-full bg-gray-50 text-gray-500 border border-gray-200 transition-colors hover:bg-[#0077b5] hover:text-white hover:border-transparent" title="Compartir en LinkedIn">
                    <i class="ph ph-linkedin-logo text-xl"></i>
                </a>
                <a href="#" class="flex items-center justify-center w-10 h-10 rounded-full bg-gray-50 text-gray-500 border border-gray-200 transition-colors hover:bg-[#1da1f2] hover:text-white hover:border-transparent" title="Compartir en Twitter">
                    <i class="ph ph-twitter-logo text-xl"></i>
                </a>
                <a href="#" class="flex items-center justify-center w-10 h-10 rounded-full bg-gray-50 text-gray-500 border border-gray-200 transition-colors hover:bg-[#1877f2] hover:text-white hover:border-transparent" title="Compartir en Facebook">
                    <i class="ph ph-facebook-logo text-xl"></i>
                </a>
                <a href="#" class="flex items-center justify-center w-10 h-10 rounded-full bg-gray-50 text-gray-500 border border-gray-200 transition-colors hover:bg-[#25d366] hover:text-white hover:border-transparent" title="Compartir por WhatsApp">
                    <i class="ph ph-whatsapp-logo text-xl"></i>
                </a>
            </div>
        </div>
    </div>

    <script>
        // Lógica de seguridad para limpiar el lado del cliente basada en tu archivo original
        document.addEventListener("DOMContentLoaded", function() {
            localStorage.clear();
            sessionStorage.clear();
            console.log("Datos de sesión local limpiados exitosamente.");
        });
    </script>
</body>
</html>
